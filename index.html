<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2aa8ff">
<meta name="description" content="Aero Smash: rompe orbes, mejora tus habilidades y viaja de la noche al día en un mundo Frutiger Aero.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aero Smash">
<meta property="og:title" content="Aero Smash"><meta property="og:description" content="Rompe orbes y mejora tus habilidades. ¿Me superas?"><meta property="og:image" content="icons/icon-512.png">
<title>Aero Smash</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--lime:#a6e22e;--lime2:#6fbf12;--sky:#2aa8ff;--sky2:#0a7fe0;--ink:#0b3a5c}
html,body{height:100%;overflow:hidden;font-family:'Nunito','Segoe UI',system-ui,sans-serif;color:var(--ink)}
body{background:#5ab8f5}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
.app{position:fixed;inset:0;z-index:1;max-width:620px;margin:0 auto}

/* ---------- vidrio blanco ---------- */
.glass{position:relative;overflow:hidden;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(232,248,255,.66));
  border:1px solid rgba(255,255,255,.98);
  box-shadow:0 12px 34px rgba(0,60,130,.28),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(140,215,255,.4),inset 0 -14px 26px rgba(170,230,255,.25);
  backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(165deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.18) 28%,rgba(255,255,255,0) 29%)}
.glass>*{position:relative;z-index:1}
.lowfx .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(232,248,255,.9))}

/* ---------- gel ---------- */
.gel{--c1:#f2ffc8;--c2:#b8ee40;--c3:#76c414;--c4:#c8f560;--gl:rgba(140,220,30,.5);--ts:rgba(40,90,0,.55);
  position:relative;overflow:hidden;border-radius:999px;border:1px solid rgba(40,90,40,.3);
  font-family:inherit;font-weight:900;color:#fff;text-shadow:0 1px 2px var(--ts);cursor:pointer;
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 48%,var(--c3) 52%,var(--c4) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -5px 9px rgba(255,255,255,.4),0 3px 8px rgba(0,50,100,.22),0 0 10px var(--gl),0 0 0 2px rgba(255,255,255,.7);
  transition:transform .08s,filter .2s}
.gel::before{content:"";position:absolute;left:5%;right:5%;top:1px;height:48%;border-radius:999px 999px 45% 45%/999px 999px 14px 14px;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.2));pointer-events:none}
.gel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);background-size:300% 100%;background-position:150% 0;animation:sweep 5s infinite}
.lowfx .gel::after{display:none}
@keyframes sweep{0%,72%{background-position:150% 0}100%{background-position:-60% 0}}
.gel>*{position:relative;z-index:1}
.gel:active:not(:disabled){transform:scale(.94);filter:brightness(1.1)}
.gel.blue{--c1:#d8f3ff;--c2:#4ab9ff;--c3:#0a84e0;--c4:#80d6ff;--gl:rgba(30,160,255,.5);--ts:rgba(0,50,110,.55)}
.gel.purple{--c1:#f0e2ff;--c2:#b07ef5;--c3:#7c4ad8;--c4:#c39cff;--gl:rgba(150,90,240,.45);--ts:rgba(50,0,100,.5)}
.gel.orange{--c1:#fff0c0;--c2:#ffbe3a;--c3:#ee8a0a;--c4:#ffd36a;--gl:rgba(255,160,20,.45);--ts:rgba(120,50,0,.5)}
.gel.teal{--c1:#d0fff6;--c2:#36d8c4;--c3:#0aa290;--c4:#66ecda;--gl:rgba(20,200,180,.45);--ts:rgba(0,80,70,.5)}
.gel.white{--c1:#ffffff;--c2:#f2fbff;--c3:#dcf0fc;--c4:#f4fcff;--gl:rgba(120,200,255,.3);color:#0a6ab8;text-shadow:0 1px 0 #fff}
.gel.white::after{display:none}
.gel.gel:disabled{--c1:#f6f9fb;--c2:#e0e8ee;--c3:#cad6de;--c4:#e6edf2;--gl:transparent;color:#93a8b6;text-shadow:0 1px 0 #fff;cursor:default}
.gel.gel:disabled::after{display:none}

/* ---------- pantalla principal: solo el orbe ---------- */
#stage{position:absolute;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;width:86%;pointer-events:none}
.lvlname{font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 10px rgba(60,180,255,.9),0 2px 3px rgba(0,50,110,.55)}
.sub2{font-weight:800;font-size:12px;color:#fff;opacity:.92;text-shadow:0 1px 3px rgba(0,50,110,.8);margin-top:1px}
.matinfo{font-weight:800;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,50,110,.85);margin-top:3px;min-height:14px}
.timer{display:none;margin:7px auto 0;width:max-content;font-weight:900;font-size:14px;padding:3px 14px;border-radius:999px;color:#fff;
  background:linear-gradient(180deg,#ffd6c4,#ff7448 48%,#e04414 52%,#ff9a6e);border:1px solid rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:0 0 12px rgba(255,100,40,.55)}
.timer.frozen{background:linear-gradient(180deg,#e8f8ff,#7cd0ff 48%,#2a9be8 52%,#9ee0ff);box-shadow:0 0 12px rgba(60,180,255,.8)}
.timer.mode{background:linear-gradient(180deg,#f0e2ff,#b07ef5 48%,#7c4ad8 52%,#c39cff);box-shadow:0 0 12px rgba(150,90,240,.75)}
.combo{position:absolute;left:14px;bottom:30px;pointer-events:none;opacity:0;transition:opacity .2s;text-align:left}
.combo span{font-weight:900;font-size:15px;color:#fff;text-shadow:0 0 8px rgba(255,170,30,.9),0 2px 2px rgba(150,70,0,.7)}
.combo .cbar{width:90px;height:6px;border-radius:999px;background:rgba(255,255,255,.4);margin-top:3px;overflow:hidden}
.combo .cbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#fff3a0,#ffad2f);width:0}
/* botón del menú */
.mbtn{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:72px;height:72px;border-radius:50%;z-index:5;cursor:pointer;
  border:3px solid #fff;background:radial-gradient(circle at 50% 78%,#d8ff7a,#8ad61e 38%,#1fa8ff 74%,#0a6fc8);
  box-shadow:0 8px 22px rgba(0,60,130,.4),0 0 18px rgba(160,230,60,.55),inset 0 -8px 14px rgba(0,40,100,.3);transition:transform .12s}
.mbtn::before{content:"";position:absolute;left:12%;top:4%;width:76%;height:46%;border-radius:50%;background:linear-gradient(180deg,#fff,rgba(255,255,255,.1))}
.mbtn .ic{position:relative;z-index:1;display:grid;gap:4px;justify-items:center}
.mbtn .ic i{display:block;width:26px;height:4px;border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(0,50,110,.5)}
.mbtn:active{transform:translateX(-50%) scale(.92)}
.mbtn.glow{animation:mglow 1.2s infinite alternate}
@keyframes mglow{to{box-shadow:0 8px 22px rgba(0,60,130,.4),0 0 30px 8px rgba(200,255,90,.9),inset 0 -8px 14px rgba(0,40,100,.3)}}
#mbadge{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;z-index:2;display:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ff4d6d 50%,#c0002a);border:2px solid #fff;box-shadow:0 0 8px #ff4d6d}

/* ---------- menú (hoja de vidrio) ---------- */
#scrim{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 30%,rgba(120,210,255,.12),rgba(0,40,90,.35));opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:620px;height:calc(100% - 14px);z-index:21;display:flex;flex-direction:column;padding:6px 10px 10px;
  border-radius:28px 28px 0 0!important;transform:translate(-50%,104%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet .stripe{position:absolute;left:-10%;right:-10%;top:-34px;height:70px;border-radius:50%;border-bottom:5px solid rgba(166,226,46,.75);pointer-events:none;z-index:0}
.grab{width:46px;height:5px;border-radius:9px;background:rgba(10,90,160,.25);margin:2px auto 6px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.lg{width:34px;height:34px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 50% 75%,#d8ff7a,#8ad61e 40%,#1fa8ff 78%,#0a6fc8);box-shadow:0 2px 6px rgba(0,60,120,.35),0 0 0 2px #fff}
.lg::before{content:"";position:absolute;left:12%;top:5%;width:76%;height:46%;border-radius:50%;background:linear-gradient(180deg,#fff,rgba(255,255,255,.1))}
.lg::after{content:"🔨";position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.logo{font-weight:900;font-size:20px;letter-spacing:-.4px;line-height:1;background:linear-gradient(180deg,#22a8ff 0%,#0a78d8 50%,#5cb812 51%,#a6e22e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #fff)}
.wallet{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:3px;padding:2px 9px 2px 5px;border-radius:999px;font-weight:900;font-size:14px;
  background:linear-gradient(180deg,#fff 0%,#f2fbff 50%,#dff2fd 51%,#f6fcff 100%);border:1px solid rgba(130,200,245,.8);box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(0,60,120,.15)}
.drop{display:inline-block;width:13px;height:17px;flex:none;background:radial-gradient(circle at 35% 35%,#fff 0 18%,#5fd0ff 30%,#0a7fd6 100%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;vertical-align:-2px;margin-right:2px;filter:drop-shadow(0 1px 1px rgba(0,60,120,.4))}
.pearl{display:inline-block;width:12px;height:12px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f4e9ff 40%,#b9a2e0);vertical-align:-1px;margin-right:2px;box-shadow:0 0 4px rgba(150,100,220,.6)}
.gem{display:inline-block;width:12px;height:12px;flex:none;transform:rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#fff,#7ff0ff 35%,#1aa0e8 70%,#0a5aa8);vertical-align:-1px;margin:0 3px 0 1px;box-shadow:0 0 5px rgba(40,180,255,.8)}
.caps{display:flex;gap:5px}
.cap{width:34px;height:30px;padding:0;font-size:14px;border-radius:10px!important}
.xcap{--c1:#ffc8b8;--c2:#f0664a;--c3:#c82a10;--c4:#f07a5a;--gl:rgba(255,80,40,.4);--ts:rgba(80,0,0,.5)}
.status{padding:7px 10px;border-radius:18px;margin-bottom:7px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(225,245,255,.7));border:1px solid #fff;box-shadow:inset 0 0 0 1px rgba(140,210,255,.35)}
.hpwrap{height:16px;border-radius:999px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(210,235,250,.8),rgba(240,250,255,.8));border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 2px 4px rgba(0,50,100,.25)}
.hp{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;transition:width .1s linear;overflow:hidden;
  background:linear-gradient(180deg,#f2ffc8 0%,#b8ee40 48%,#76c414 52%,#c8f560 100%)}
.hp::before{content:"";position:absolute;left:4px;right:4px;top:1px;height:45%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.15))}
.hp.boss{background:linear-gradient(180deg,#ffd6c4 0%,#ff7448 48%,#e04414 52%,#ff9a6e 100%)}
.hp.mode{background:linear-gradient(180deg,#f0e2ff 0%,#b07ef5 48%,#7c4ad8 52%,#c39cff 100%)}
.hptxt{position:absolute;inset:0;font-size:11px;font-weight:900;line-height:15px;text-align:center;color:#073050;text-shadow:0 1px 0 #fff,0 0 4px #fff;z-index:2}
.info2{display:flex;justify-content:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.chip{font-weight:900;font-size:11px;padding:1px 9px;border-radius:999px;color:#0b4a78;background:#fff;border:1px solid rgba(140,210,255,.7)}
.chip.hot{display:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(180deg,#fff0c0,#ffbe3a 48%,#ee8a0a 52%,#ffd36a);border-color:#fff}
.chip.zen{display:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);background:linear-gradient(180deg,#d0fff6,#36d8c4 48%,#0aa290 52%,#66ecda);border-color:#fff}
.skills{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:4}
.mwal{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.mwal .pill{font-size:13.5px;box-shadow:0 2px 8px rgba(0,60,120,.25),inset 0 1px 0 #fff}
.sk{position:relative;width:50px;height:50px;border-radius:50%;border:2px solid #fff;font-family:inherit;font-weight:900;font-size:10px;color:#fff;
  box-shadow:0 4px 10px rgba(0,40,100,.28),inset 0 -5px 9px rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.7);overflow:hidden;display:none;transition:transform .1s}
.sk::before{content:"";position:absolute;left:12%;top:3%;width:76%;height:44%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));z-index:2;pointer-events:none}
.sk .cdov{position:absolute;inset:0;border-radius:50%;z-index:1;background:conic-gradient(rgba(10,35,70,.6) calc(var(--p,0)*360deg),transparent 0)}
.sk .ico{position:relative;z-index:3;font-size:20px;display:block;line-height:1;margin-top:2px}
.sk .t{position:relative;z-index:3}
.sk.ready{box-shadow:0 4px 10px rgba(0,40,100,.28),0 0 12px 3px rgba(200,255,90,.95)}
.sk.on{animation:pulse .45s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.tabs{display:flex;gap:3px;margin-bottom:8px;padding:4px;border-radius:999px;
  background:linear-gradient(180deg,#ffffff,#eef8ff 50%,#ddf0fc 51%,#f2faff);border:1px solid rgba(140,210,255,.8);box-shadow:inset 0 1px 3px rgba(0,60,120,.12),0 2px 6px rgba(0,60,120,.12)}
.tab{flex:1;min-width:0;padding:5px 1px 6px;font-size:9.5px;line-height:1.1;border-radius:999px;white-space:nowrap;position:relative;
  font-family:inherit;font-weight:900;color:#0a6ab8;background:transparent;border:1px solid transparent;cursor:pointer}
.tab b{display:block;font-size:21px;line-height:1.2}
.tab.on{color:#fff;text-shadow:0 1px 2px rgba(40,90,0,.6);border-color:rgba(255,255,255,.9);
  background:linear-gradient(180deg,#f2ffc8 0%,#b8ee40 48%,#76c414 52%,#c8f560 100%);box-shadow:inset 0 1px 0 #fff,0 0 10px rgba(140,220,30,.55)}
.tab .dot{position:absolute;top:0;right:4px;width:9px;height:9px;border-radius:50%;z-index:3;display:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ff4d6d 50%,#c0002a);border:1px solid #fff;box-shadow:0 0 6px #ff4d6d}
.list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;contain:content}
.list>*{flex-shrink:0}
.list::-webkit-scrollbar{width:7px}
.list::-webkit-scrollbar-thumb{border-radius:8px;background:linear-gradient(90deg,#c8f560,#76c414);border:1px solid #fff}
.up{display:flex;align-items:center;gap:12px;padding:11px 11px;border-radius:20px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#ffffff 0%,#f6fcff 48%,#e4f4fd 52%,#f4fbff 100%);
  border:1px solid #fff;box-shadow:0 2px 6px rgba(0,60,120,.1),inset 0 0 0 1px rgba(150,215,255,.45)}
.up::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,#c8f560,#76c414);opacity:.85}
.up.locked{opacity:.55}
.up.done{box-shadow:0 0 12px rgba(255,170,30,.5),inset 0 0 0 1px rgba(255,190,80,.7)}
.orb{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:23px;position:relative;border:2px solid #fff;
  box-shadow:0 3px 8px rgba(0,60,120,.25),inset 0 -4px 7px rgba(0,0,0,.14)}
.orb::after{content:"";position:absolute;left:12%;top:4%;width:76%;height:44%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.info{flex:1;min-width:0}
.info h3{font-size:15.5px;font-weight:900;line-height:1.15;color:#0a3d63}
.badge{display:inline-block;font-size:9.5px;font-weight:900;padding:1px 6px;margin-left:4px;border-radius:999px;vertical-align:1px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);
  background:linear-gradient(180deg,#a8e0ff,#2aa0f0 50%,#0a80d8 51%,#5cc4ff);border:1px solid rgba(255,255,255,.9)}
.info p{font-size:12.5px;font-weight:700;color:#3a6a8a;line-height:1.22;margin-top:2px}
.prog{height:8px;border-radius:999px;margin-top:4px;background:rgba(0,80,140,.1);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,40,80,.2)}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,#f2ffc8,#b8ee40 48%,#76c414 52%,#c8f560)}
.buy{flex:none;min-width:92px;padding:12px 12px;font-size:14.5px}
.note{font-size:11.5px;font-weight:700;color:#2a5d80;padding:7px 11px;line-height:1.35;border-radius:14px;background:rgba(255,255,255,.65);border:1px solid #fff}
.h{font-weight:900;font-size:15.5px;padding:6px 6px 0;color:#0a6ab8;text-shadow:0 1px 0 #fff;display:flex;align-items:center;gap:6px}
.h::after{content:"";flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(166,226,46,.8),rgba(42,168,255,.25),transparent)}
.big{width:100%;padding:11px;font-size:14.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;font-weight:800;padding:10px 12px;border-radius:12px;
  background:linear-gradient(180deg,#fff,#eef8ff);border:1px solid #fff;box-shadow:inset 0 0 0 1px rgba(150,215,255,.35)}
.two{display:flex;gap:6px}.two>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{border-radius:18px;padding:10px 5px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#ffffff 0%,#f4fbff 48%,#e0f2fd 52%,#f4fbff 100%);
  border:1px solid #fff;box-shadow:0 2px 5px rgba(0,60,120,.1),inset 0 0 0 1px rgba(150,215,255,.4);font-size:10.5px;font-weight:800;line-height:1.2}
.card .e{font-size:30px;display:block;margin-bottom:2px;filter:drop-shadow(0 2px 2px rgba(0,60,120,.25))}
.card.no{opacity:.5;filter:grayscale(.6)}
.card.sel{box-shadow:0 0 0 2px #fff,0 0 12px 2px rgba(140,220,30,.85)}
.card.evo{background:linear-gradient(180deg,#fffbe8 0%,#fff0c0 48%,#ffd97a 52%,#fff2c8 100%);box-shadow:0 0 10px rgba(255,180,40,.6),inset 0 0 0 1px rgba(255,200,80,.8)}
.card small{display:block;color:#3a6e90;font-size:9.5px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{padding:4px 9px;font-size:11px}
.cal{display:flex;gap:5px;justify-content:center;margin:2px 0 8px}
.cal i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;position:relative;overflow:hidden;
  color:#5a7a90;background:linear-gradient(180deg,#fff,#eef7fd 50%,#d9ebf6 51%,#f2f9fd);border:1px solid #fff;box-shadow:0 1px 4px rgba(0,60,120,.2)}
.cal i::before{content:"";position:absolute;left:12%;top:3%;width:76%;height:44%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.cal i.on{color:#fff;text-shadow:0 1px 1px rgba(40,90,0,.5);background:linear-gradient(180deg,#f2ffc8,#b8ee40 48%,#76c414 52%,#c8f560)}
.cal i.today{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);background:linear-gradient(180deg,#fff0c0,#ffbe3a 48%,#ee8a0a 52%,#ffd36a);box-shadow:0 0 10px rgba(255,160,20,.7)}

/* tutorial y celebración */
.tut{position:fixed;left:50%;transform:translateX(-50%);top:120px;width:min(92vw,420px);display:none;align-items:flex-start;gap:9px;padding:10px 12px;z-index:45;pointer-events:none}
.tut button{pointer-events:auto}
.tut.low{top:auto;bottom:16px}
.tut.show{display:flex;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.tut .av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;position:relative;border:2px solid #fff;
  background:radial-gradient(circle at 50% 30%,#dcfff9,#1fc2b0 60%,#0a8a80);box-shadow:0 2px 6px rgba(0,60,120,.3)}
.tut p{font-size:12.5px;font-weight:800;color:#0b3a5c;line-height:1.3}
.tut .tb{display:flex;gap:6px;margin-top:6px}
.tut .tb button{padding:4px 12px;font-size:11.5px}
.hl{animation:hl 1s infinite alternate!important}
@keyframes hl{from{box-shadow:0 0 0 2px #fff,0 0 6px 2px rgba(200,255,60,.6)}to{box-shadow:0 0 0 3px #fff,0 0 22px 9px rgba(200,255,60,.95)}}
.celeb{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:44;opacity:0}
.celeb.show{animation:celeb 1.9s ease-out forwards}
@keyframes celeb{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.celeb .rays{position:absolute;width:420px;height:420px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.35) 0 10deg,transparent 10deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 6s linear infinite}
.celeb .ct{position:relative;text-align:center;padding:12px 22px;border-radius:22px;font-weight:900;font-size:24px;color:#fff;line-height:1.1;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.95);
  text-shadow:0 0 10px rgba(166,226,46,.9),0 2px 3px rgba(0,60,120,.6);box-shadow:0 0 30px rgba(200,255,120,.7)}
.celeb .ct small{display:block;font-size:13px;margin-top:4px;text-shadow:0 1px 2px rgba(0,40,100,.6)}

/* ---------- toast y ventanas ---------- */
.toast{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-24px) scale(.9);opacity:0;transition:.32s cubic-bezier(.2,1.4,.4,1);z-index:50;
  padding:8px 16px;font-weight:900;font-size:13.5px;pointer-events:none;white-space:nowrap;max-width:92vw;text-overflow:ellipsis;border-radius:999px!important;color:#0a3d63;
  box-shadow:0 8px 24px rgba(0,50,110,.3),0 0 14px rgba(166,226,46,.6),inset 0 1px 0 #fff}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.modal{position:fixed;inset:0;z-index:80!important;background:radial-gradient(circle at 50% 40%,rgba(120,210,255,.3),rgba(0,40,80,.5));display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .box{max-width:350px;width:100%;text-align:center;padding:0;animation:pop .35s cubic-bezier(.2,1.5,.4,1);max-height:92vh;display:flex;flex-direction:column}
@keyframes pop{from{transform:scale(.8)}}
.wt{padding:8px 8px 8px 14px;font-weight:900;font-size:15px;color:#fff;text-align:left;text-shadow:0 1px 2px rgba(0,50,110,.55);position:relative;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,#c8eeff 0%,#4ab9ff 48%,#0a84e0 52%,#80d6ff 100%);border-bottom:3px solid rgba(166,226,46,.85)}
.wt::after{content:"";position:absolute;left:4px;right:4px;top:1px;height:45%;border-radius:18px 18px 40% 40%/18px 18px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.05));pointer-events:none}
.wt span{position:relative;z-index:1}
.xbtn{position:relative;z-index:2;width:38px;height:22px;border-radius:6px;border:1px solid rgba(80,0,0,.45);color:#fff;font-weight:900;font-size:12px;font-family:inherit;
  background:linear-gradient(180deg,#ffc8b8 0%,#f0664a 48%,#c82a10 52%,#f07a5a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);text-shadow:0 1px 1px rgba(0,0,0,.5);display:none}
.mbody{padding:14px 16px 16px;overflow-y:auto}
.mp{font-size:13.5px;font-weight:700;margin-bottom:14px;color:#174d72}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:11px;font-size:14.5px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:14px;margin-bottom:6px;font-weight:900;font-size:14.5px;
  background:linear-gradient(180deg,#fff,#eef8ff);border:1px solid #fff;box-shadow:inset 0 0 0 1px rgba(150,215,255,.35)}
.sw{width:52px;height:28px;border-radius:999px;border:1px solid rgba(0,50,90,.25);position:relative;transition:.2s;flex:none;
  background:linear-gradient(180deg,#e0e8ee,#c8d6de);box-shadow:inset 0 2px 4px rgba(0,30,60,.25)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;transition:.2s;background:radial-gradient(circle at 40% 30%,#fff,#e0eef5 60%,#b8cad6);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:linear-gradient(180deg,#f2ffc8,#b8ee40 48%,#76c414 52%,#c8f560)}
.sw.on::after{left:26px}
.seg{display:flex;gap:4px}.seg button{padding:5px 10px;font-size:12px}
textarea{width:100%;height:86px;border-radius:12px;padding:8px;font-family:ui-monospace,monospace;font-size:11px;color:#0b3a5c;resize:none;
  -webkit-user-select:text;user-select:text;border:1px solid rgba(130,200,245,.85);background:linear-gradient(180deg,#fff,#f2faff);box-shadow:inset 0 2px 4px rgba(0,50,100,.15);margin-bottom:10px}
.big-score{font-size:50px;font-weight:900;line-height:1;background:linear-gradient(180deg,#22a8ff,#0a78d8 50%,#5cb812 51%,#a6e22e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #fff);margin:4px 0}
.story{text-align:left;font-size:14px;line-height:1.45}
.story .av{float:left;width:46px;height:46px;margin:0 10px 4px 0;border-radius:50%;display:grid;place-items:center;font-size:26px;border:2px solid #fff;background:radial-gradient(circle at 50% 30%,#dcfff9,#1fc2b0 60%,#0a8a80);box-shadow:0 2px 6px rgba(0,60,120,.3)}
.credits{height:260px;overflow:hidden;position:relative;-webkit-mask:linear-gradient(transparent,#000 15%,#000 85%,transparent);mask:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
.credits .roll{animation:roll 16s linear forwards;font-weight:800;font-size:14px;line-height:1.7;color:#0a5a9a}
.credits .roll div:first-child{font-size:20px;font-weight:900;color:#0a78d8}
@keyframes roll{from{transform:translateY(260px)}to{transform:translateY(-100%)}}
.uav{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;position:relative;border:2px solid #fff;
  background:radial-gradient(circle at 50% 78%,#d8ff7a,#8ad61e 40%,#1fa8ff 78%,#0a6fc8);box-shadow:0 2px 6px rgba(0,60,120,.35)}
.uav::before{content:"";position:absolute;left:12%;top:5%;width:76%;height:44%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.05))}
.uname{font-weight:900;font-size:17px;line-height:1.05;color:#0a3d63;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo.sm{font-size:12px}
.pform{width:min(88vw,360px);padding:14px;text-align:center}
.pf-t{font-weight:900;font-size:16px;color:#0a6ab8;margin-bottom:8px}
.inp{width:100%;padding:11px 16px;border-radius:999px;border:2px solid #fff;font-family:inherit;font-weight:900;font-size:18px;text-align:center;color:#0a3d63;outline:none;
  -webkit-user-select:text;user-select:text;background:linear-gradient(180deg,#fff,#eef8ff);box-shadow:inset 0 2px 4px rgba(0,50,100,.18),0 0 0 2px rgba(140,210,255,.7)}
.inp:focus{box-shadow:inset 0 2px 4px rgba(0,50,100,.18),0 0 0 3px rgba(166,226,46,.9)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.avs button{aspect-ratio:1;border-radius:50%;border:2px solid #fff;font-size:22px;background:linear-gradient(180deg,#fff,#e4f4fd);box-shadow:0 2px 5px rgba(0,60,120,.2);cursor:pointer}
.avs button.on{background:radial-gradient(circle at 50% 78%,#d8ff7a,#8ad61e 45%,#1fa8ff 85%);box-shadow:0 0 0 2px #fff,0 0 12px rgba(166,226,46,.9)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;margin-bottom:6px;background:linear-gradient(180deg,#fff,#eef8ff);border:1px solid #fff;box-shadow:inset 0 0 0 1px rgba(150,215,255,.4);text-align:left}
.prow .uav{width:36px;height:36px;font-size:19px}
.prow b{flex:1;font-size:15px}
.prow button{padding:6px 12px;font-size:12px}
/* vitrina de trofeos */
.tsum{display:flex;justify-content:space-around;align-items:center;padding:8px;border-radius:18px;background:linear-gradient(180deg,#fff,#eef8ff);border:1px solid #fff;box-shadow:inset 0 0 0 1px rgba(150,215,255,.4)}
.tsum div{text-align:center;font-weight:900;font-size:18px;color:#0a6ab8}.tsum small{display:block;font-size:10px;color:#3a6e90}
.tcat{border-radius:18px;padding:8px 10px 0;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(225,244,255,.75));border:1px solid #fff;box-shadow:inset 0 0 0 1px rgba(150,215,255,.4)}
.tcat .th{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13.5px;color:#0a3d63}
.tcat .th small{font-size:11px;color:#3a6e90;font-weight:800}
.shelf{display:flex;align-items:flex-end;justify-content:space-around;padding:8px 2px 0;margin:6px -10px 0;border-radius:0 0 18px 18px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(170,225,255,.35));min-height:92px}
.shelf::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:8px;border-radius:6px;background:linear-gradient(180deg,#fff,#bfe6fb 50%,#8ccff5 51%,#d8f1ff);box-shadow:0 2px 4px rgba(0,60,120,.25),0 0 0 1px rgba(255,255,255,.9)}
.troph{position:relative;z-index:1;margin-bottom:9px;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;align-items:center}
.troph:active{transform:scale(.92)}
.troph.lock{opacity:.35;filter:grayscale(1)}
.troph.new{animation:glowt 1.2s infinite alternate}
@keyframes glowt{to{filter:drop-shadow(0 0 10px rgba(255,230,90,1))}}
.secbar{display:none;align-items:center;gap:10px;margin-bottom:8px}
.back{padding:8px 14px;font-size:13px;flex:none}
.sect{font-weight:900;font-size:20px;color:#0a3d63}
.subtabs{display:none;gap:6px;margin-bottom:8px}.subtabs button{flex:1;padding:8px 6px;font-size:12.5px}
.desk{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:6px 2px}
.tile{position:relative;aspect-ratio:1/1.22;border-radius:24px;border:1px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,#ffffff 0%,#f4fbff 50%,#e2f3fd 51%,#f6fcff 100%);box-shadow:0 4px 12px rgba(0,60,120,.14),inset 0 0 0 1px rgba(150,215,255,.45);transition:transform .12s}
.tile:active{transform:scale(.94)}
.tile .ti{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;font-size:38px;position:relative;border:2px solid #fff;
  background:var(--tc);background:radial-gradient(circle at 50% 85%,#fff 0,var(--tc) 55%,color-mix(in srgb,var(--tc) 70%,#003060) 100%);box-shadow:0 4px 10px rgba(0,60,120,.25),inset 0 -5px 9px rgba(0,0,0,.12)}
.tile .ti::before{content:"";position:absolute;left:10%;top:4%;width:80%;height:46%;border-radius:16px 16px 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.05))}
.tile .tn{font-weight:900;font-size:15px;color:#0a3d63}
.tile small{font-size:10.5px;font-weight:800;color:#5a7a90;margin-top:-5px}
.tile.lock{opacity:.6;filter:grayscale(.7)}
.tile .bd{position:absolute;top:8px;right:10px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff4d6d 50%,#c0002a);border:2px solid #fff;box-shadow:0 0 6px #ff4d6d}
.hoy{display:flex;justify-content:space-around;gap:6px;margin-top:4px;padding:11px;border-radius:18px;border:1px solid #fff;font-family:inherit;font-weight:900;font-size:13px;color:#0a5a9a;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(225,244,255,.75));box-shadow:inset 0 0 0 1px rgba(150,215,255,.45)}
.lockrow{font-size:12.5px;font-weight:800;color:#6a8aa0;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.5);border:1px dashed rgba(120,180,220,.7)}
.up.best{box-shadow:0 0 0 2px #fff,0 0 14px rgba(255,190,40,.7),inset 0 0 0 1px rgba(255,200,80,.7)}
.badge.gold{background:linear-gradient(180deg,#fff0c0,#ffbe3a 50%,#ee8a0a 51%,#ffd36a)}
.seg.bm{display:flex;gap:6px}.seg.bm button{flex:1;padding:8px;font-size:13px}
.shareimg{width:100%;border-radius:14px;box-shadow:0 4px 14px rgba(0,50,110,.3);margin-bottom:8px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}

/* ---------- inicio ---------- */
#start{position:fixed;inset:0;z-index:70;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.7),rgba(160,225,255,.5) 45%,rgba(20,130,230,.72));
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);transition:opacity .6s}
#start.hide{opacity:0;pointer-events:none}
.st-orb{width:146px;height:146px;border-radius:50%;position:relative;display:grid;place-items:center;font-size:62px;animation:float 3s ease-in-out infinite;
  background:radial-gradient(circle at 50% 78%,#e2ff8a,#8ad61e 38%,#1fa8ff 74%,#0a5fb8);border:3px solid #fff;
  box-shadow:0 18px 40px rgba(0,50,110,.4),0 0 40px rgba(200,255,120,.8),inset 0 -14px 26px rgba(0,30,80,.3)}
.st-orb::before{content:"";position:absolute;left:12%;top:4%;width:76%;height:46%;border-radius:50%;background:linear-gradient(180deg,#fff,rgba(255,255,255,.08))}
.st-orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(255,255,255,.75);border-top-color:transparent;border-bottom-color:transparent;animation:spin 4s linear infinite}
.st-orb span{position:relative;z-index:1;filter:drop-shadow(0 3px 3px rgba(0,40,90,.4))}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.st-logo{width:150px;height:152px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 14px 22px rgba(0,50,110,.4)) drop-shadow(0 0 24px rgba(200,255,140,.6))}
.st-word{width:min(78vw,330px);aspect-ratio:420/300;margin-top:-6px;filter:drop-shadow(0 6px 10px rgba(0,50,110,.3))}
.mic{width:34px;height:35px;filter:drop-shadow(0 2px 3px rgba(0,50,110,.3))}
.st-title{font-size:46px;font-weight:900;letter-spacing:-1px;line-height:1;background:linear-gradient(180deg,#fff 0%,#c8eeff 45%,#22a8ff 50%,#a6e22e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0a5a9a) drop-shadow(0 0 14px rgba(255,255,255,.8))}
.st-sub{font-weight:900;font-size:13px;color:#fff;letter-spacing:3px;text-shadow:0 1px 3px rgba(0,40,100,.7)}
.st-play{width:220px;padding:15px;font-size:22px;margin-top:6px}
.st-info{font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,40,100,.8);min-height:18px}
</style>
</head>

<canvas id="bg"></canvas>
<div class="app">

<script>
(()=>{
// ================= logos =================

function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return (n<10&&n%1?n.toFixed(1):Math.floor(n)).toString();
  const i=Math.floor(Math.log10(n)/3);
  if(i<SUF.length){const v=n/Math.pow(1000,i);return (v<100?v.toFixed(v<10?2:1):Math.floor(v))+SUF[i];}
  return n.toExponential(2).replace('+','');
}

const isBoss=l=>l%10===0;
const isStory=l=>l%BLEN===0;
const normHp=l=>12*Math.pow(1.165,Math.min(l,150)-1)*Math.pow(1.125,Math.max(0,l-150))*(1+.2*Math.min(l,400));
const baseHp=l=>Math.ceil(normHp(l)*(isStory(l)?14:isBoss(l)?6:1));
const matRw=()=>obj?(obj.mat==='arcoiris'?obj.rwMul:MATS[obj.mat].rw):1;
const reward=l=>Math.ceil(baseHp(l)/(isBoss(l)?2.5:8)*gotaMul()*matRw()+1);
const rewardN=l=>Math.ceil(normHp(l)/8*gotaMul()+1); // premio de un orbe normal (base de regalos)
let incRate=0,incAcc=0; // gotas por segundo que ganas rompiendo
const giftBase=()=>Math.max(rewardN(S.lvl),incRate*3);

function pickMat(){
  if(S.lvl<4)return 'cristal';
  const r=Math.random()*100;
  if(S.lvl<12)return r<55?'cristal':r<75?'hielo':r<90?'burbuja':'electrico';
  return r<36?'cristal':r<50?'hielo':r<63?'burbuja':r<73?'electrico':r<82?'arcoiris':r<91?'espejo':'gelatina';
}
function makeObj(){
  const l=S.lvl;let mat,B=null,boss=false,story=false,nm,timed=0,info;
  if(inRun('ch')){mat=['cristal','burbuja','gelatina','hielo','espejo','electrico'][run.score%6];hpMax=Math.ceil(tapPower()*14*MATS[mat].hp);nm=`Desafío #${run.score+1}`;info='⏱️ ¡Rompe todo lo que puedas!'}
  else if(inRun('dg')){const r=run.room;boss=r===10;mat=boss?'cristal':pick(MATK);if(boss)B=pick(BOSSES);
    hpMax=Math.ceil((tapPower()*(8+r*3)+autoBase(S.ups.auto)*dmgAll()*3)*(boss?4:1)*MATS[mat].hp);
    nm=boss?`🏰 ${B.n}`:`🏰 Sala ${r}/10`;timed=boss?30:15;info=boss?B.info:MATS[mat].info||'Rómpelo antes de que acabe el tiempo'}
  else{
    boss=isBoss(l);story=isStory(l);mat=boss?'cristal':pickMat();hpMax=Math.ceil(baseHp(l)*MATS[mat].hp);
    if(story){B={n:BIOMES[biomeIdx(l)].boss,m:'mix',info:'⭐ Jefe de historia: escudo → burbujas → punto débil'}}
    else if(boss)B=BOSSES[(l/10-1)%BOSSES.length];
    nm=boss?B.n:NAMES[Math.floor((l-1)/3)%NAMES.length]+(mat==='cristal'?'':' de '+MATS[mat].n.toLowerCase());
    if(boss&&!S.zen)timed=story?45:bossTime();
    info=boss?B.info:MATS[mat].info;
  }
  hp=hpMax;
  const hue=mat==='hielo'?195:mat==='electrico'?55:mat==='espejo'?210:mat==='gelatina'?(340+l*7)%360:mat==='burbuja'?(300+l*13)%360:boss?(l*37)%360:(l*47+190)%360;
  const cracks=[];
  for(let i=0;i<12;i++){
    const a=rnd(0,Math.PI*2),pts=[[0,0]];let r=0,ang=a;
    while(r<1){r+=rnd(.14,.26);ang+=rnd(-.5,.5);pts.push([Math.cos(ang)*Math.min(r,1),Math.sin(ang)*Math.min(r,1)])}
    cracks.push(pts);
  }
  obj={hue,boss,story,mat,cracks,shake:0,scale:0.3,name:nm,ph:Math.random()*6,squish:0,rwMul:1,burns:[],frozenUntil:0,
    mech:B?B.m:null,shield:false,shieldT:now()+3000,minis:[],splits:0,weak:{a:rnd(0,7),t:now()+2500}};
  bossEnd=timed?now()+timed*1000:0;
  setT('objname',(boss?(story?'⭐ ':'👑 '):'')+nm);
  setT('matinfo',info||'');
  const isMode=!!run;
  $('timer').style.display=(timed||inRun('ch'))?'block':'none';
  $('timer').classList.toggle('mode',isMode);
  $('hp').classList.toggle('boss',boss&&!isMode);$('hp').classList.toggle('mode',isMode);
  if(AC){if(boss)sfx.bossAppear();else if(!inRun('ch'))sfx.spawn()}
  if(!run&&!boss&&l%10===9&&!S.zen)toast('👑 ¡El jefe está cerca! Prepárate');
}

let AC=null,sfxBus,musBus,musFilt;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
    sfxBus=AC.createGain();sfxBus.gain.value=S.set.sfx?1:0;sfxBus.connect(comp);
    musBus=AC.createGain();musBus.gain.value=S.set.music?1:0;
    musFilt=AC.createBiquadFilter();musFilt.type='lowpass';musFilt.frequency.value=16000;
    const dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.38;fb.gain.value=.38;wet.gain.value=.5;
    musBus.connect(musFilt);musFilt.connect(comp);musFilt.connect(dl);dl.connect(fb).connect(dl);dl.connect(wet).connect(comp);
  }catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
let voices=0;
function tone(f,d,o={}){
  if(!AC||voices>48)return;const {type='sine',v=.12,to=null,delay=0,att=.005,bus=sfxBus,vib=0}=o;
  const t=AC.currentTime+delay,os=AC.createOscillator(),g=AC.createGain();
  os.type=type;os.frequency.setValueAtTime(f,t);if(to)os.frequency.exponentialRampToValueAtTime(to,t+d);
  if(vib){const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=vib;lg.gain.value=f*.04;lf.connect(lg).connect(os.frequency);lf.start(t);lf.stop(t+d+.05)}
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(g).connect(bus);os.start(t);os.stop(t+d+.05);voices++;os.onended=()=>voices--;
}
let NB=null;
function noise(d,o={}){
  if(!AC||voices>48)return;const {ft='highpass',f=2000,v=.2,delay=0,q=1,to=null,att=0,bus=sfxBus}=o;
  if(!NB){const len=AC.sampleRate*1.5;NB=AC.createBuffer(1,len,AC.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<len;i++)c[i]=Math.random()*2-1}
  const t=AC.currentTime+delay,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;fl.type=ft;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);fl.Q.value=q;
  if(att){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+att)}else g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl).connect(g).connect(bus);s.start(t,Math.random()*.5);s.stop(t+d+.05);voices++;s.onended=()=>voices--;
}

function endDungeon(win){

  addPearls(pr);S.money+=g;S.stats.earned+=g;S.dg.best=Math.max(S.dg.best,rooms);if(win)S.dg.wins++;sxp(rooms*5);

let last=now(),stormAcc=0,achAcc=0,prevCombo=0,paused=true,dateAcc=0;
setInterval(()=>{
  const n=now(),dt=Math.min((n-last)/1000,1);last=n;
  incRate=incRate*.998+(incAcc/Math.max(dt,.001))*.002;incAcc=0;
  if(paused||modalOpen){if(bossEnd)bossEnd+=dt*1000;if(run&&run.end)run.end+=dt*1000;if(ev)ev.end+=dt*1000;updateHud();return}
  let d=dps()*(obj.mat==='hielo'?1.5:1);
  if(obj.boss){if(obj.shield)d*=.1;if(obj.minis.length)d*=.25}
  if(obj.burns.length){let b=0;obj.burns=obj.burns.filter(x=>x.end>n);for(const x of obj.burns)b+=x.v;if(b>0){hp-=b*dt;if(Math.random()<.3){const c=center();pushP({x:c.x+rnd(-c.r*.6,c.r*.6),y:c.y+rnd(0,c.r*.6),vx:rnd(-.3,.3),vy:-1.2,life:.7,r:rnd(2,4),h:rnd(15,40),sat:100,star:true})}if(hp<=0){breakObj();return}}}
  if(d>0){hp-=d*dt;dolAcc+=d*dt;
    if(n>dolNext){dolNext=n+Math.max(1400,3200-S.ups.auto*25)*(active('freeze')?.6:1)*(evOn('tide')?.5:1);if(AC)spawnDolphin();else dolAcc=0}
    if(hp<=0)breakObj()}
  if(active('storm')){stormAcc+=dt*12;while(stormAcc>=1){stormAcc--;const c=center(),a=rnd(0,7),rr2=rnd(0,c.r*.8);doTap(c.x+Math.cos(a)*rr2,c.y+Math.sin(a)*rr2,'storm')}}
  SK.forEach(s=>{const st=SKST[s.id],on=n<st.end;
    if(on){st.amb+=dt;const per={fury:.35,rain:.14,freeze:.5,storm:.55}[s.id];if(st.amb>=per){st.amb=0;st.k++;sfx.amb[s.id](st.k)}}
    if(st.on&&!on)sfx.end[s.id]();st.on=on;
    const rdy=S.ups[s.id]>0&&n>=st.ready;if(rdy&&!st.rdy&&st.ready>0){sfx.ready();toast(s.e+' ¡'+s.n+' lista!')}st.rdy=rdy});
  if(obj.boss){
    const mech=obj.mech,ph=mech==='mix'?mixPhase():-1;
    if(active('freeze')){if(bossEnd)bossEnd+=dt*1000;if(obj.shield){obj.shield=false;sfx.shieldDown()}}
    else{
      const shieldy=mech==='escudo'||mech==='geoda'||ph===0;
      if(shieldy){if(n>obj.shieldT){obj.shield=!obj.shield;const g=mech==='geoda';obj.shieldT=n+(obj.shield?(g?1500:2000):(g?4500:3500));obj.shield?sfx.shieldUp():sfx.shieldDown()}}
      else if(obj.shield){obj.shield=false;sfx.shieldDown()}
      const healy=mech==='regen'||mech==='geoda'||ph===2;
      if(healy&&hp<hpMax){const heal=hpMax*(mech==='regen'?.03:mech==='mix'?.01:.015)*dt;hp=Math.min(hpMax,hp+heal);regenAcc+=dt;
        if(regenAcc>1.4){regenAcc=0;const c=center();floats.push({x:c.x+rnd(-30,30),y:c.y-c.r*.5,t:'+'+fmt(heal/dt*1.4),life:.9,heal:true});sfx.heal()}}
      if(weakOn()&&n>obj.weak.t){obj.weak.a=rnd(0,7);obj.weak.t=n+2500;sfx.weakMove()}
    }
    if(mech==='divide'){const f=hpFrac();if((obj.splits===0&&f<.66)||(obj.splits===1&&f<.33)){obj.splits++;for(let i=0;i<3;i++)obj.minis.push({a:i*2.094+rnd(0,.5)});sfx.split();vib(30);toast('🫧 ¡Se dividió! Revienta las burbujas')}}
    if(ph===1&&obj.splits===0){obj.splits=1;for(let i=0;i<4;i++)obj.minis.push({a:i*1.571});sfx.split();vib(30);toast('⭐ ¡Fase 2! Revienta las burbujas')}
  }
  if(bossEnd){const left=(bossEnd-n)/1000;
    setT('timer',(inRun('dg')?`🏰 ${run.room}/10 · `:'')+(active('freeze')?'❄️ ':'⏱️ ')+Math.max(0,left).toFixed(1)+'s');$('timer').classList.toggle('frozen',active('freeze'));
    if(left<8&&!active('freeze')&&n-lastBeat>(left<4?500:1000)){lastBeat=n;sfx.heartbeat()}
    if(left<=0){bossEnd=0;bossFail()}}
  if(inRun('ch')){const left=Math.min(60,(run.end-n)/1000);setT('timer',`⏱️ ${Math.max(0,left).toFixed(1)}s · 🔨 ${run.score}`);
    if(left<5&&n-lastBeat>1000){lastBeat=n;sfx.count(false)}
    if(left<=0)endChallenge()}
  else if(!run){
    if(!golden&&Math.random()<goldRate()*dt)spawnGold();
    if(!S.zen){if(!ev&&n>evNext)startEvent();
      if(evOn('meteor')){meteorT+=dt;if(meteorT>.65){meteorT=0;meteors.push({x:rnd(.08,.8)*W,y:-20,vx:rnd(-.8,.8),vy:rnd(2.2,3.6),r:15})}}}
    if(ev&&n>ev.end){ev=null;evNext=n+rnd(150,260)*1000;meteors.length=0;sfx.evEnd()}
  }
  if(combo>0&&n-lastTap>(S.zen?2500:1200)){combo=Math.max(0,combo-Math.ceil(combo*dt*2))}
  if(prevCombo>=20&&combo===0)sfx.comboBreak();prevCombo=combo;
  achAcc+=dt;if(achAcc>1){achAcc=0;checkAch();tutCheck()}
  dateAcc+=dt;if(dateAcc>60){dateAcc=0;if(S.daily.date!==dstr(new Date())||S.season.id!==seasonId())dailyLogin()}
  updateHud();
},50);

  if(obj){const c=center(),st=cv.getBoundingClientRect();e.style.top=Math.max(118,st.top+c.y-c.r*1.13-62)+'px'}e.classList.add('show');setTimeout(()=>{e.classList.remove('show');setTimeout(nextToast,260)},1600)}

  const row=(k,lab)=>`<div class="tog"><span>${lab}</span><button class="sw ${S.set[k]?'on':''}" data-set="${k}" aria-label="${lab}"></button></div>`;
  const gf=['auto','alto','bajo'].map(v=>`<button class="gel ${S.set.gfx===v?'blue':'white'}" data-gfx="${v}"><span>${v[0].toUpperCase()+v.slice(1)}</span></button>`).join('');
  modal('⚙️ Ajustes',row('music','🎵 Música')+row('sfx','🔊 Efectos')+row('vib','📳 Vibración')+row('fps','📈 Mostrar FPS')+`<div class="tog"><span>🖥️ Gráficos</span><div class="seg">${gf}</div></div><div style="font-size:11.5px;color:#3a6e90">Usa “Bajo” si el juego va lento en tu celular.</div>`,[['Listo',null,'blue']],true);
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.set;S.set[k]=!S.set[k];b.classList.toggle('on',S.set[k]);
    if(AC){sfxBus.gain.value=S.set.sfx?1:0;musBus.gain.value=S.set.music?1:0}
    if(k==='vib'&&S.set.vib)vib(30);sfx.toggle(S.set[k]);save()});
  document.querySelectorAll('[data-gfx]').forEach(b=>b.onclick=()=>{S.set.gfx=b.dataset.gfx;document.querySelectorAll('[data-gfx]').forEach(x=>{x.classList.toggle('blue',x===b);x.classList.toggle('white',x!==b)});
    setLow(S.set.gfx==='bajo');fpsT0=0;fpsEma=16;sfx.toggle(true);save()});
};
setInterval(()=>{if(!paused)save()},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)save()});

// ================= inicio =================
function offlineCheck(){
  const capH=4+S.tal.t3*2,eff=(.4+S.tal.t3*.1)*(1+PL('buho')*.1),sec=Math.min(offSec,capH*3600),d=dps();
  if(sec>60&&d>0){
    const g=Math.ceil(d*sec*eff/normHp(S.lvl)*rewardN(S.lvl)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
    modal('🌙 Mientras no estabas…',`Tu 🐬 delfín siguió rompiendo cosas durante ${h?h+'h ':''}${m}min y juntó <b><span class="drop"></span>${fmt(g)}</b> gotas.`,
      [['¡Recoger!',()=>{S.money+=g;S.stats.earned+=g;sfx.goldGet();sfx.dolChirp();vib([20,30,20]);checkAch();save();renderList()},'']],true);
  }
}
if(LOW)document.body.classList.add('lowfx');
let migrated=0;
if((S.v||0)<7&&(S.v||0)>=6){S.v=7}
if((S.v||0)<6){if(S.stats.taps>0){const pw=tapPower()*6+autoBase(S.ups.auto)*dmgAll()*2;let l=1;while(l<S.lvl&&normHp(l+1)<pw*4)l++;
  if(l<S.lvl){migrated=S.lvl-l;S.lvl=Math.max(1,l-(l%10===0?1:0))}addPearls(10)}S.v=7}
PETS.forEach(q=>{if(q.story&&q.story<1001&&S.best>=q.story&&!S.pets[q.id])S.pets[q.id]=1;if(q.story===1001&&S.best>1001&&!S.pets[q.id])S.pets[q.id]=1});
resize();seasonCheck();makeObj();renderList();requestAnimationFrame(loop);
applyProfile();
$('stlogo').innerHTML=LOGO_AS('s');$('stword').innerHTML=LOGO_WORD('s');$('mic').innerHTML=LOGO_AS('m');
let newAv=curProf().av;
if(!curProf().name){$('pform').style.display='block';$('play').querySelector('span').textContent='▶ Crear y jugar';$('avs').innerHTML=avPicker(newAv).replace('<div class="avs" id="mavs">','').replace(/<\/div>$/,'');bindAv($('avs'),a=>newAv=a);
  $('stinfo').textContent=S.stats.taps?'Ponle nombre a tu partida':'¡Bienvenido a Aero Smash!'}
else $('stinfo').textContent=`${curProf().av} Hola, ${curProf().name} · Nivel ${S.lvl}`;
if(PROF.list.length>1||curProf().name)$('pswitch').style.display='inline-block';
$('pswitch').onclick=()=>{ac();usersModal()};
$('play').onclick=()=>{
  ac();
  if(!curProf().name){const n=($('pname').value||'').trim().slice(0,16);if(!n){const i=$('pname');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');sfx.deny();i.focus();return}
    curProf().name=n;curProf().av=newAv;saveProf();applyProfile()}
  $('pswitch').style.display='none';sfx.startup();vib(30);paused=false;last=now();evNext=now()+rnd(90,150)*1000;
  $('start').classList.add('hide');setTimeout(()=>$('start').style.display='none',650);
  makeObj();
  if(migrated)modal('🔧 Juego rebalanceado','Ajustamos la economía para que haya muchos más niveles por recorrer. Tu nivel se acomodó a tu poder actual (nivel '+S.lvl+') y te regalamos <b><span class="pearl"></span>10 perlas</b>. ¡Tu récord y todo lo demás se mantienen!',[['¡Vamos!',null,'blue']],true);
  offlineCheck();dailyLogin();save();renderList();
  if(S.tut<99)setTimeout(tutShow,500);
  setTimeout(()=>toast(`${curProf().av} ¡Hola, ${curProf().name}!`),900);
};
})();
</script>
